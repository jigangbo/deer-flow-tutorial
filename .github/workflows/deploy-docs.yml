name: Deploy Tutorial Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs toolchain
        run: pip install mkdocs mkdocs-material mkdocs-awesome-pages-plugin jieba

      - name: Build & publish to gh-pages
        run: mkdocs gh-deploy --force
